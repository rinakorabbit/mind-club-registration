<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 210" role="img" aria-label="ดอกบัว สัญลักษณ์แห่งความสงบ" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E9A9C4"/><stop offset="1" stop-color="#F6C9DA"/>
    </linearGradient>
    <linearGradient id="pMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F1B9CF"/><stop offset="1" stop-color="#FAD7E5"/>
    </linearGradient>
    <linearGradient id="pFront" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F8CADC"/><stop offset="1" stop-color="#FFEAF2"/>
    </linearGradient>
    <path id="petal" d="M0 0 C-27 -28 -27 -82 0 -118 C27 -82 27 -28 0 0 Z"/>
  </defs>

  <!-- น้ำ -->
  <ellipse cx="130" cy="176" rx="118" ry="22" fill="#D6E8F7"/>
  <ellipse cx="130" cy="176" rx="92" ry="15" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".9"/>
  <ellipse cx="130" cy="176" rx="64" ry="9" fill="none" stroke="#A9CDEA" stroke-width="2.5" opacity=".9"/>

  <!-- ใบบัว -->
  <ellipse cx="46" cy="178" rx="38" ry="10" fill="#BFE3CB"/>
  <ellipse cx="216" cy="180" rx="34" ry="9" fill="#CDEBD3"/>
  <path d="M46 178 L70 178" stroke="#9CCFAE" stroke-width="2" opacity=".8"/>

  <!-- กลีบดอกบัว (ฐานที่ 130,166) -->
  <g transform="translate(130 166)" stroke="#E08FB0" stroke-width="1.6" stroke-linejoin="round">
    <use href="#petal" transform="rotate(-68)" fill="url(#pBack)"/>
    <use href="#petal" transform="rotate(68)" fill="url(#pBack)"/>
    <use href="#petal" transform="rotate(-42)" fill="url(#pMid)"/>
    <use href="#petal" transform="rotate(42)" fill="url(#pMid)"/>
    <use href="#petal" transform="rotate(-18)" fill="url(#pFront)"/>
    <use href="#petal" transform="rotate(18)" fill="url(#pFront)"/>
    <use href="#petal" transform="rotate(0) scale(.94)" fill="url(#pFront)"/>
  </g>

  <!-- เกสร -->
  <ellipse cx="130" cy="164" rx="26" ry="7" fill="#FBE7A1"/>
  <circle cx="130" cy="160" r="4" fill="#F4CF63"/>
</svg>
